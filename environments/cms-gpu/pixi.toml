[workspace]
name = "cms-gpu-eaf"
version = "0.1.0"
description = "Updated CMS analysis and GPU ML environment for Fermilab EAF"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.67"

[system-requirements]
cuda = "13.0"
libc = { family = "glibc", version = "2.34" }

[dependencies]
python = "3.13.*"
numpy = ">=2.5.3,<3"
scipy = "*"
pandas = "*"
scikit-learn = "*"
numba = "*"
h5py = "*"
pyarrow = "*"
matplotlib = "*"
seaborn = "*"
plotly = "*"
altair = "*"
streamlit = ">=1.64.0"
sympy = "*"
networkx = "*"
# HEP libraries and their compiled dependencies stay together on conda-forge.
root = "*"
pythia8 = "*"
lhapdf = "*"
xrootd = "*"
fsspec-xrootd = "*"
# datasets 5.0.1 requires fsspec <=2026.6.0.
fsspec = ">=2023.1.0,<=2026.6.0"
awkward = "*"
uproot = "*"
vector = "*"
hist = "*"
boost-histogram = "*"
mplhep = "*"
iminuit = "*"
lmfit = "*"
uncertainties = "*"
# Notebook and development tools.
jupyterlab = "*"
notebook = "*"
ipykernel = "*"
ipywidgets = "*"
ipyparallel = "*"
compilers = "*"
cmake = "*"
ninja = "*"
graphviz = "*"
pytest = "*"
pre-commit = "*"
rich = "*"
tqdm = "*"
pyyaml = "*"
psutil = "*"
requests = "*"
# Shared conda/PyPI dependency required by current huggingface-hub.
click = ">=8.4.2,<9"
pip = "*"

[pypi-dependencies]
# Explicit upstream CUDA wheels prevent accidental CPU-only installation.
torch = { version = ">=2.14,<2.15", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = ">=0.29,<0.30", index = "https://download.pytorch.org/whl/cu130" }
cupy-cuda13x = ">=14.2,<15"
lightning = ">=2.6.6"
accelerate = ">=1.15.0"
datasets = ">=5.0.1"
transformers = ">=5.17.0"
huggingface-hub = ">=1.32.0"
wandb = ">=0.30.0"
hepdata-lib = ">=0.21.0"
hepdata-validator = ">=0.3.6"
nvidia-ml-py = ">=13.610.43"
heptokens = { path = "../..", editable = true }

[activation.env]
PYTHONNOUSERSITE = "1"

[tasks]
check = "python check_environment.py"
test = { cmd = "python -m pytest ../../tests", cwd = ".", env = { OMP_NUM_THREADS = "2", MKL_NUM_THREADS = "2", OPENBLAS_NUM_THREADS = "2" } }
register-kernel = "python -m ipykernel install --user --name cms-gpu-eaf --display-name 'CMS GPU (EAF, Pixi)'"
